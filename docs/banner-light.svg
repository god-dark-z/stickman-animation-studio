<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Stickman Animation Studio — one prompt to a finished cartoon, every frame drawn by code (light theme)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfaf3"/>
      <stop offset="0.55" stop-color="#f6f1e6"/>
      <stop offset="1" stop-color="#efe8d9"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c9d4e8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c9d4e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#f5a623" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#f5a623" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6ddc9"/>
      <stop offset="1" stop-color="#d8cdb6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <!-- stars -->
  <g fill="#5a5040">
    <circle cx="80" cy="46" r="1.6" opacity="0.7"/><circle cx="210" cy="88" r="1.1" opacity="0.5"/>
    <circle cx="320" cy="34" r="1.4" opacity="0.6"/><circle cx="470" cy="70" r="1.1" opacity="0.45"/>
    <circle cx="640" cy="38" r="1.6" opacity="0.6"/><circle cx="760" cy="92" r="1.2" opacity="0.5"/>
    <circle cx="900" cy="44" r="1.5" opacity="0.65"/><circle cx="1020" cy="80" r="1.1" opacity="0.5"/>
    <circle cx="1130" cy="36" r="1.4" opacity="0.7"/><circle cx="560" cy="110" r="1" opacity="0.4"/>
    <circle cx="150" cy="150" r="1" opacity="0.35"/><circle cx="1080" cy="140" r="1.1" opacity="0.4"/>
  </g>
  <!-- moon glow -->
  <circle cx="1096" cy="64" r="70" fill="url(#moon)"/>
  <circle cx="1096" cy="64" r="30" fill="#5a5040"/>

  <!-- skyline silhouettes -->
  <g fill="#10162c">
    <rect x="700" y="196" width="70" height="120"/>
    <rect x="790" y="168" width="56" height="148"/>
    <rect x="866" y="210" width="80" height="106"/>
    <rect x="964" y="150" width="60" height="166"/>
    <path d="M 964 150 L 994 118 L 1024 150 Z"/>
    <rect x="1052" y="196" width="72" height="120"/>
    <rect x="1140" y="176" width="60" height="140"/>
  </g>
  <!-- lit windows -->
  <g fill="#f5a623" opacity="0.85">
    <rect x="806" y="188" width="8" height="10"/><rect x="824" y="206" width="8" height="10"/>
    <rect x="978" y="170" width="8" height="10"/><rect x="996" y="196" width="8" height="10"/>
    <rect x="986" y="228" width="8" height="10"/><rect x="1160" y="204" width="8" height="10"/>
  </g>
  <g fill="#7a6a4f" opacity="0.5">
    <rect x="716" y="216" width="8" height="10"/><rect x="886" y="230" width="8" height="10"/>
    <rect x="1068" y="216" width="8" height="10"/><rect x="736" y="252" width="8" height="10"/>
  </g>

  <!-- ground + road -->
  <rect x="0" y="312" width="1200" height="48" fill="url(#ground)"/>
  <rect x="0" y="308" width="1200" height="5" fill="#2c3654"/>
  <g stroke="#4a5578" stroke-width="6" stroke-linecap="round">
    <line x1="40" y1="336" x2="86" y2="336"/><line x1="150" y1="336" x2="196" y2="336"/>
    <line x1="260" y1="336" x2="306" y2="336"/><line x1="370" y1="336" x2="416" y2="336"/>
    <line x1="480" y1="336" x2="526" y2="336"/><line x1="590" y1="336" x2="636" y2="336"/>
    <line x1="700" y1="336" x2="746" y2="336"/><line x1="810" y1="336" x2="856" y2="336"/>
    <line x1="920" y1="336" x2="966" y2="336"/><line x1="1030" y1="336" x2="1076" y2="336"/>
  </g>

  <!-- street lamp + warm pool (the one warm light) -->
  <ellipse cx="300" cy="250" rx="150" ry="110" fill="url(#lamp)"/>
  <rect x="296" y="140" width="8" height="170" fill="#1a2138"/>
  <path d="M 300 140 Q 322 118 344 132" stroke="#1a2138" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="348" cy="140" r="9" fill="#f5a623"/>
  <circle cx="348" cy="140" r="16" fill="#f5a623" opacity="0.35"/>

  <!-- the stickman (bean rig, ink outlines, hoodie) -->
  <g transform="translate(205 306)">
    <ellipse cx="0" cy="2" rx="64" ry="12" fill="#000" opacity="0.35"/>
    <g>
      <!-- legs -->
      <path d="M -18 -74 Q -30 -40 -24 -2" stroke="#2a1c15" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M 18 -74 Q 30 -40 24 -2" stroke="#2a1c15" stroke-width="9" fill="none" stroke-linecap="round"/>
      <ellipse cx="-26" cy="-2" rx="13" ry="8.5" fill="#2a1c15"/>
      <ellipse cx="26" cy="-2" rx="13" ry="8.5" fill="#2a1c15"/>
      <!-- bean body: hoodie -->
      <path d="M 0 -226 C 50 -226 54 -186 52 -150 C 50 -104 44 -72 0 -72 C -44 -72 -50 -104 -52 -150 C -54 -186 -50 -226 0 -226 Z" fill="#ff8a2a" stroke="#2a1c15" stroke-width="6.5" stroke-linejoin="round"/>
      <path d="M -34 -220 Q 0 -192 34 -220" fill="none" stroke="#e06a12" stroke-width="7" stroke-linecap="round"/>
      <!-- left arm down, right arm raised holding phone -->
      <path d="M -44 -196 Q -66 -160 -58 -122" stroke="#2a1c15" stroke-width="9" fill="none" stroke-linecap="round"/>
      <circle cx="-58" cy="-122" r="9.5" fill="#2a1c15"/>
      <path d="M 44 -196 Q 76 -214 84 -252" stroke="#2a1c15" stroke-width="9" fill="none" stroke-linecap="round"/>
      <circle cx="84" cy="-252" r="9.5" fill="#2a1c15"/>
      <!-- phone + glow -->
      <rect x="72" y="-292" width="26" height="42" rx="5" fill="#f4f6fb" stroke="#2a1c15" stroke-width="4"/>
      <rect x="77" y="-286" width="16" height="28" rx="2" fill="#9fd8ff"/>
      <!-- head -->
      <circle cx="0" cy="-286" r="62" fill="#2a1c15" stroke="#2a1c15" stroke-width="6.5"/>
      <!-- messy hair -->
      <path d="M -58 -300 Q -34 -338 4 -332 Q 42 -338 58 -302 Q 40 -318 20 -314 Q 30 -326 12 -324 Q -6 -334 -22 -320 Q -40 -326 -58 -300 Z" fill="#4a2c14" stroke="#2a1c15" stroke-width="4" stroke-linejoin="round"/>
      <!-- face: shocked brows + round eyes + open mouth -->
      <circle cx="-21" cy="-292" r="11" fill="#fff" stroke="#2a1c15" stroke-width="4.5"/>
      <circle cx="21" cy="-292" r="11" fill="#fff" stroke="#2a1c15" stroke-width="4.5"/>
      <circle cx="-21" cy="-292" r="4" fill="#2a1c15"/>
      <circle cx="21" cy="-292" r="4" fill="#2a1c15"/>
      <ellipse cx="0" cy="-260" rx="12" ry="14" fill="#2a1c15"/>
      <!-- rim light -->
      <path d="M 38 -338 A 60 60 0 0 1 58 -292" stroke="#f5a623" stroke-width="5" fill="none" opacity="0.6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- heat squiggles above phone -->
  <g stroke="#f5a623" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M 268 22 q 6 -10 0 -20 q -6 -10 0 -20"/>
    <path d="M 292 16 q 6 -10 0 -20 q -6 -10 0 -20"/>
    <path d="M 316 22 q 6 -10 0 -20 q -6 -10 0 -20"/>
  </g>

  <!-- title block -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="420" y="138" font-size="46" font-weight="800" fill="#2a1c15" letter-spacing="0.5"
      stroke="#0b1026" stroke-width="10" paint-order="stroke" stroke-linejoin="round">STICKMAN <tspan fill="#ff8a2a">ANIMATION</tspan> STUDIO</text>
    <text x="424" y="182" font-size="21" font-weight="400" fill="#c3cde9"
      stroke="#0b1026" stroke-width="6" paint-order="stroke" stroke-linejoin="round">One prompt → a finished cartoon. Every frame and sound drawn by code.</text>
    <text x="424" y="214" font-size="15" font-weight="600" fill="#9aa8cc" letter-spacing="3"
      stroke="#0b1026" stroke-width="5" paint-order="stroke" stroke-linejoin="round">ENGLISH NARRATION · SYNC-LOCKED · 4 QA GATES · NO AI IMAGES</text>
    <!-- chips -->
    <g font-size="16" font-weight="700">
      <rect x="424" y="236" rx="14" width="140" height="32" fill="#182041" stroke="#2c3654"/>
      <text x="494" y="257" text-anchor="middle" fill="#ffd27a">/make-video</text>
      <rect x="578" y="236" rx="14" width="120" height="32" fill="#182041" stroke="#2c3654"/>
      <text x="638" y="257" text-anchor="middle" fill="#8fd0ff">4 QA GATES</text>
      <rect x="712" y="236" rx="14" width="128" height="32" fill="#182041" stroke="#2c3654"/>
      <text x="776" y="257" text-anchor="middle" fill="#9fe8a8">REMOTION 4</text>
      <rect x="854" y="236" rx="14" width="160" height="32" fill="#182041" stroke="#2c3654"/>
      <text x="934" y="257" text-anchor="middle" fill="#e8a0ff">10+ AGENTS</text>
    </g>
  </g>
</svg>
